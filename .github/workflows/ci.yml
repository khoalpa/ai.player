name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            install-command: python -m pip install -c constraints/windows-release-py310.txt -e ".[dev,packaging,offline-ai,gpu]"
          - python-version: "3.11"
            install-command: python -m pip install -e ".[dev,offline-ai]"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install-command }}

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Runtime doctor
        run: python scripts/runtime_doctor.py --ci
