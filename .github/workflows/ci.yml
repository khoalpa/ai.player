name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quick:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install lite dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Benchmark preset guard
        run: |
          python scripts/compare_performance_presets.py --language en --json
          python scripts/compare_performance_presets.py --language vi
          python scripts/workflow_benchmark.py --check-baselines --baseline docs/workflow_benchmark_baselines.json

  test:
    needs: quick
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            install-command: python -m pip install -c constraints/windows-release-py310.txt -e ".[dev,packaging,offline-ai,gpu]"
          - python-version: "3.11"
            install-command: python -m pip install -e ".[dev,offline-ai]"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install-command }}

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Runtime doctor
        run: python scripts/runtime_doctor.py --ci

  package-smoke:
    needs: quick
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Release worktree gate
        shell: pwsh
        run: .\scripts\check_release_worktree.ps1 -FailOnModified

      - name: PyInstaller smoke build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data/tmp/package-smoke | Out-Null
          python -m PyInstaller --noconfirm --clean --distpath data/tmp/ci-dist --workpath data/tmp/ci-build "AI Player.spec" 2>&1 |
            Tee-Object -FilePath data/tmp/package-smoke/pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch built app
        shell: pwsh
        run: |
          .\scripts\smoke_launch_app.ps1 -AppPath "data\tmp\ci-dist\AI Player\AI Player.exe" -Seconds 8 2>&1 |
            Tee-Object -FilePath data/tmp/package-smoke/launch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release smoke tests
        shell: pwsh
        run: |
          python -m pytest tests/test_release_smoke.py 2>&1 |
            Tee-Object -FilePath data/tmp/package-smoke/release-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-logs
          if-no-files-found: warn
          path: |
            data/tmp/package-smoke/**
            data/tmp/ci-build/**/*.txt
            data/tmp/ci-build/**/*.log
