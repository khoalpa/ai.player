[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-player-youtube-client"
version = "0.1.0"
description = "Optional YouTube channel client adapter for AI Player."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["ai_player_youtube_client*"]
