[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-player-adult-extractors"
version = "0.1.0"
description = "Private yt-dlp extractors for internal AI Player builds."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.15",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["yt_dlp_plugins*"]
